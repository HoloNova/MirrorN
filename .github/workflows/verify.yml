name: Verify new site

on:
  pull_request:
    paths-ignore:
      - 'archive/**'
  push:
    branches: [main]
    paths-ignore:
      - 'archive/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIRRORN_BUILD_MODE: preview
    steps:
      - name: Checkout reviewed event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - name: Determine affected scope
        id: scope
        run: node scripts/ci-scope.ts
      - name: pnpm from project version
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.8.1'
          run_install: false
          cache: true
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Documentation-only check
        if: steps.scope.outputs.full != 'true'
        run: pnpm docs:check
      - name: Content, lint, types, build and artifact check
        if: steps.scope.outputs.full == 'true'
        run: pnpm check
      - name: Retain noindex preview artifact
        if: steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

# No pull_request_target, repository write permission, deployment secret, deploy or automatic PR.
